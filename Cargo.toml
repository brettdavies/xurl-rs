[workspace]
resolver = "3"
members = ["crates/xdk", "crates/xurl-cli", "crates/xdk-consumer-check"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/brettdavies/xurl-rs"
homepage = "https://github.com/brettdavies/xurl-rs"
authors = ["Brett Davies <pm8fp22mbg@privaterelay.appleid.com>"]
rust-version = "1.96.0"

# Versions shared by both members live here so the two manifests cannot drift
# apart on a dependency they both compile.
[workspace.dependencies]
xdk-rs = { version = "0.5.1", path = "crates/xdk" }
# No TLS backend on this entry: `xdk-rs` selects one through its own
# `rustls` / `native-tls` features, and a backend named here would be on in
# every configuration, including the ones meant to prove it absent.
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "stream", "form"] }
url = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2.0.0", default-features = false, features = ["serialize", "deserialize"] }
tracing = "0.1"
schemars = "1"
libc = "0.2"
tempfile = "3"
wiremock = "0.6"
rstest = "0.27"
# `std` alone: the `fork` and `timeout` features run each case in a child
# process, which a pure function under test does not need.
proptest = { version = "1", default-features = false, features = ["std"] }
serial_test = "4"
regex = "1"

# Cargo reads profiles from the workspace root only, so this table builds every
# workspace binary and the release archives. `cargo install xurl-rs` builds the
# published crate as its own root and reads the copy in crates/xurl-cli/Cargo.toml
# instead; crates/xurl-cli/tests/release_profile_guard.rs holds the two equal.
#
# Of the profiles measured on 4 cores, thin LTO over 4 units at opt-level "z"
# builds fastest (44 s cold) and gives the smallest `xr` (9.2 MB). CPU-bound
# commands run up to half again as long, a few milliseconds, and a networked
# call about 1.4 ms longer, against the round trip to X.
[profile.release]
strip = true
lto = "thin"
codegen-units = 4
opt-level = "z"
panic = "abort"
