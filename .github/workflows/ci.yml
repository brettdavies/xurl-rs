# Source repo CI wrapper — calls the centralized reusable workflow.
# Copy to .github/workflows/ci.yml in the tool repo.
#
# The reusable workflow runs: fmt, clippy, test, cargo-deny check, package check,
# Windows dep check, and changelog verification (on PRs to main).
# No secrets required — only needs contents: read and pull-requests: read.
#
# Push trigger is scoped to main/dev only — feature branches get CI via
# pull_request. This prevents duplicate runs when a branch push and PR
# creation fire seconds apart. tags-ignore prevents CI on release tag pushes
# (the release workflow handles those). paths-ignore skips doc-only pushes.
# paths-ignore is NOT applied to pull_request to avoid blocking required
# status checks when a PR only touches ignored paths.
name: CI

on:
  push:
    branches: [main, dev]
    tags-ignore: ['**']
    paths-ignore:
      - '**.md'
      - 'LICENSE-*'
      - 'docs/**'
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    uses: brettdavies/.github/.github/workflows/rust-ci.yml@main
    with:
      # An advisory turns this run red rather than leaving it green with one
      # failed job. The ruleset already blocks the merge; this is so the run's
      # colour matches what a human scanning the Actions tab should act on.
      advisories_blocking: true

  lint-stdio:
    name: Output discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run scripts/lint-stdio.sh
        run: bash scripts/lint-stdio.sh

  # docs.rs builds with warnings denied; a broken intra-doc link or bad code
  # fence fails here instead of surfacing after publish.
  docs:
    name: Doc build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

  # completions/ is generated from the clap definition; --check fails when a
  # CLI surface or clap_complete change lands without regenerating.
  completions:
    name: Completions freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Verify completions match the CLI definition
        run: ./scripts/generate-completions.sh --check
