# Source repo CI wrapper — calls the centralized reusable workflow.
#
# The reusable workflow runs: fmt, clippy, test, cargo-deny check, package check,
# Windows dep check, and changelog verification (on PRs to main).
# No secrets required — only needs contents: read and pull-requests: read.
#
# Checks run on pull requests: merges to main and dev are squash merges, so the
# merge commit's tree equals the PR head these jobs already verified. The
# compensating local gate is the hook pair at scripts/hooks/, which mirrors these
# jobs before the push leaves the machine.
#
# A push to dev or main, or a manual dispatch, is a warm run. Each job that keeps
# a Rust cache builds what its check compiles with execution off and saves the
# cache, and the jobs that keep none skip. A pull request restores from its own
# ref, its base branch, and the default branch, and only a run outside a pull
# request can write those two branches' scopes, so without warm runs every new
# PR starts cold.
#
# Swatinem/rust-cache keys each cache on the job id, the `key` input, and every
# CARGO*, RUST*, CC*, CFLAGS*, CXX*, and CMAKE* variable in the job's environment.
# A warm run matches a pull request's keys only while those stay the same in both
# modes, so what differs between the modes lives in step conditions and commands.
#
# `cache-on-failure` applies to pull request runs alone. A warm run that fails
# partway would leave a partial entry under the exact key, and rust-cache skips
# saving after an exact-key restore, so no later run would refill it.
# Restore probe.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# The group key leads with a literal token naming this workflow. A key built
# only from context (`${{ github.workflow }}`) is one the reusable called below
# also produces, because `github.workflow` resolves to this caller's name inside
# a called workflow; both then land in one group and the reusable's queue
# cancels this run. The reusable carries its own `rust-ci-` token for its jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each job installs the toolchain rust-toolchain.toml names, through rustup.
# Line tables keep file and line in a failing test's backtrace while cutting a
# cold build by about 40% and the target directory by more than half against
# full debug info. Incremental artifacts only add weight to a cached CI build.
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always
  # Differs between the modes, so its name stays outside rust-cache's prefixes.
  TEST_NO_RUN: ${{ github.event_name != 'pull_request' && '--no-run' || '' }}

jobs:
  # Whether this PR can reach cargo at all. A PR whose every path is
  # documentation no Rust source reads (scripts/cargo-inputs.sh, the filter
  # the pre-push hook also applies) skips every Rust job below; `lint` still
  # runs. A job skipped by its condition reports success, so the required
  # checks pass. Each Rust job runs unless this job answered `false`, so a
  # scope job that fails or never reports runs the full battery instead of
  # skipping it. A warm run answers `true`: it fills every job's cache, whatever
  # the push changed.
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      # The checkout is GitHub's test merge of the PR into its base, so the
      # diff against its first parent is exactly what the PR changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - name: Classify the changed paths
        id: scope
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          inputs="$(git diff --no-renames --name-only HEAD^1 HEAD | bash scripts/cargo-inputs.sh)"
          if [ -n "$inputs" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            printf 'Paths that reach cargo:\n%s\n' "$inputs"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Change scope::every changed path is documentation no Rust source reads, so the Rust jobs skip"
          fi

  ci:
    needs: scope
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    uses: brettdavies/.github/.github/workflows/rust-ci.yml@main
    with:
      # An advisory turns this run red rather than leaving it green with one
      # failed job. The ruleset already blocks the merge; this is so the run's
      # colour matches what a human scanning the Actions tab should act on.
      advisories_blocking: true
      docs_only: ${{ needs.scope.outputs.rust == 'false' }}

  # A job of its own so its checks report as `warm / <job>`, never under a
  # required `ci / <job>` name. rust-cache keys on the reusable's job ids, not
  # this caller's, so these caches are the ones the `ci` call restores.
  warm:
    if: github.event_name != 'pull_request'
    uses: brettdavies/.github/.github/workflows/rust-ci.yml@main
    with:
      warm_cache: true

  # actionlint + markdownlint from the org reusable. The markdownlint glob set
  # matches scripts/hooks/pre-push step 10 verbatim, so the hook and this job
  # cannot reach different verdicts. A crate's CHANGELOG.md is generated and
  # wraps where the generator wraps; the root one is hand-written prose routing
  # to them, so it is linted. .claude/ is a gitignored symlink to the global
  # template store, absent from this checkout and linted at its source.
  lint:
    if: github.event_name == 'pull_request'
    uses: brettdavies/.github/.github/workflows/lint-basics.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      markdownlint-globs: |
        **/*.md
        !crates/*/CHANGELOG.md
        !.claude/**

  lint-stdio:
    name: Output discipline
    needs: scope
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.scope.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run scripts/lint-stdio.sh
        run: bash scripts/lint-stdio.sh
      - name: Check concurrency group namespacing
        run: bash scripts/check-workflow-concurrency.sh

  # Docs build with warnings denied; a broken intra-doc link or bad code
  # fence fails here instead of surfacing after publish. Two builds: the
  # workspace with default features is what `cargo doc` gives a consumer,
  # and xdk-rs with every feature is what docs.rs documents, the only
  # build that reaches the `testing` module.
  docs:
    name: Doc build
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: ${{ github.event_name == 'pull_request' }}
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      # The README is the crate doc, so its programs are doctests; this is the
      # gate that fails when the landing example stops compiling. Cargo refuses
      # `--no-run` on doc tests, so a warm run builds what they link against and
      # has rustdoc list them instead.
      - name: README doctests
        run: cargo test --doc -p xdk-rs --locked${{ github.event_name != 'pull_request' && ' -- --list' || '' }}
      - name: cargo doc with every feature, as docs.rs documents it
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p xdk-rs --no-deps --all-features --locked

  # A textual diff of the library sources cannot answer whether the public API
  # broke: it misses pub fields, consts, type aliases, and traits. This reads
  # rustdoc JSON and applies Rust's own semver rules against the library's last
  # released tag, which is what consumers actually have. Comparing against `dev`
  # instead would flag churn on unreleased code that no consumer ever saw.
  #
  # Only `xdk-rs` is checked: the `xr` crate's library target exists for its own
  # tests and is not consumed. The baseline is the newest `xdk-rs-v*` tag; the
  # CLI's `v*` tags sort into the same list and would baseline the wrong crate.
  # Before the first library release no such tag exists, so the check reports
  # that it skipped rather than failing every PR on a missing baseline.
  #
  # `release-type: minor` asks the question worth blocking on: does this need a
  # major? A break the project accepts into a minor carries a required-update
  # entry in crates/xdk/Cargo.toml under
  # [package.metadata.cargo-semver-checks.lints], reviewed alongside the diff
  # that takes it.
  semver:
    name: Public API semver
    needs: scope
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.scope.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The baseline is a tag, which the default shallow fetch omits.
          fetch-depth: 0
      - name: Resolve the library's last release tag
        id: baseline
        run: |
          tag="$(git tag -l 'xdk-rs-v*' --sort=-version:refname | head -n 1)"
          if [ -z "$tag" ]; then
            echo "::notice title=Public API semver::skipped: no xdk-rs-v* tag exists yet, so there is no released baseline to compare against"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: cargo semver-checks
        if: steps.baseline.outputs.tag != ''
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: xdk-rs
          baseline-rev: ${{ steps.baseline.outputs.tag }}
          release-type: minor

  # completions/ is generated from the clap definition; --check fails when a
  # CLI surface or clap_complete change lands without regenerating.
  completions:
    name: Completions freshness
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: ${{ github.event_name == 'pull_request' }}
      # The script builds the binary in both modes. Without `--check` it writes
      # the files and compares nothing, so a warm run reports no verdict.
      - name: Verify completions match the CLI definition
        run: ./scripts/generate-completions.sh ${{ github.event_name == 'pull_request' && '--check' || '' }}

  # `webhooks listen` stops a forward program with everything it started: a
  # process group on Unix, a kill-on-close Job Object on Windows. Only a
  # Windows runner executes the Windows half, so this job runs the
  # program-target tests there, and the signed test request a caller with no
  # POSIX shell posts.
  windows:
    name: Windows program target
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.rust != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: ${{ github.event_name == 'pull_request' }}
      - name: Program-target tests
        run: cargo test --locked -p xurl-rs --test webhooks_program_tests ${{ env.TEST_NO_RUN }}
      - name: The signed test request
        run: cargo test --locked -p xurl-rs --test webhooks_tests listen_hands_out_a_signed_test_request ${{ env.TEST_NO_RUN }}

  # A package-scoped test run proves nothing about an out-of-package consumer,
  # so an embedder-shaped crate compiles and runs a read against the
  # documented surface; hiding or removing something it relies on fails here
  # before it fails a user's build.
  consumer:
    name: Consumer check
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: ${{ github.event_name == 'pull_request' }}
      - name: Build and run the consumer crate's read
        run: cargo test -p xdk-consumer-check --locked ${{ env.TEST_NO_RUN }}

  # Cargo features are additive: `--features native-tls` on top of the default
  # set compiles both backends together and never shows that native-tls stands
  # alone, so every "this backend by itself" cell starts from
  # `--no-default-features`. The cell with no backend at all is expected to
  # fail, and it asserts on the guard's message so a build that fails for any
  # other reason still turns the cell red. The two cells that also run the
  # tests are the ones whose feature set the default `ci` job never sees.
  #
  # `default` and `rustls only` compile the same set today and only because
  # `default` holds exactly one feature. `default` stays as the cell that
  # follows whatever `[features] default` lists, so a feature added there is
  # compiled under the name a reader looks for rather than silently untested.
  #
  # A matrix job skipped whole never expands, and its required `Features (...)`
  # checks would wait forever; so on a documentation-only PR this job runs and
  # every step skips.
  #
  # A warm run builds through the same steps with `--no-run` on the tests and
  # leaves the example unrun. Compiling is the whole check in the other steps, the
  # no-backend cell's included, so it runs them as they are.
  features:
    name: Features (${{ matrix.name }})
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            flags: ""
          - name: rustls only
            flags: --no-default-features --features rustls
          - name: native-tls only
            flags: --no-default-features --features native-tls
          - name: no TLS backend
            flags: --no-default-features
            must_fail: true
          - name: all features
            flags: --all-features
            test: true
          - name: testing
            flags: --features testing
            test: true
            example: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs.rust != 'false'
      - name: Install Rust
        if: needs.scope.outputs.rust != 'false'
        run: rustup toolchain install
      - name: Cache dependencies
        if: needs.scope.outputs.rust != 'false'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: ${{ github.event_name == 'pull_request' }}
          key: ${{ matrix.name }}
      - name: cargo check
        if: ${{ needs.scope.outputs.rust != 'false' && !matrix.must_fail }}
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          read -ra flags <<< "$FLAGS"
          cargo check -p xdk-rs --all-targets --locked "${flags[@]}"
      - name: cargo build --examples
        if: ${{ needs.scope.outputs.rust != 'false' && !matrix.must_fail }}
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          read -ra flags <<< "$FLAGS"
          cargo build --examples -p xdk-rs --locked "${flags[@]}"
      - name: cargo test
        if: ${{ needs.scope.outputs.rust != 'false' && matrix.test }}
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          read -ra flags <<< "$FLAGS"
          cargo test -p xdk-rs --locked "${flags[@]}" ${{ env.TEST_NO_RUN }}
      # Compilation proves nothing about whether the example works; the run
      # asserts on what the mock served and what it received.
      - name: Run the credential-free example against the testing mock
        if: ${{ github.event_name == 'pull_request' && needs.scope.outputs.rust != 'false' && matrix.example }}
        run: cargo run -p xdk-rs --example offline_search --features testing --locked
      - name: cargo check must fail on the TLS guard
        if: ${{ needs.scope.outputs.rust != 'false' && matrix.must_fail }}
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          read -ra flags <<< "$FLAGS"
          if cargo check -p xdk-rs --locked "${flags[@]}" 2> check.log; then
            echo "::error title=Features::a build with no TLS backend compiled; the compile_error! guard in crates/xdk/src/lib.rs is gone"
            exit 1
          fi
          if ! grep -F "needs a TLS backend" check.log; then
            echo "::error title=Features::the no-backend build failed, but not on the TLS guard"
            cat check.log
            exit 1
          fi

  # rust-toolchain.toml pins the compiler the other compiling jobs use, except
  # `Public API semver`, whose action installs stable. `rust-version` is the
  # promise a consumer builds against, and RELEASES.md § Versioning keeps it equal
  # to the pin. This job reads the version from the workspace manifest rather than
  # the pin, so a toolchain bump that leaves `rust-version` behind is still checked
  # on the declared version: a dependency or language feature that needs the later
  # compiler fails here alone. Step 4 of scripts/hooks/pre-push runs the same check
  # on the default features. Compiling is the whole check, so a warm run runs it
  # as it is.
  msrv:
    name: MSRV
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install
      - name: Install the declared rust-version
        id: msrv
        run: |
          set -euo pipefail
          msrv="$(awk -F\" '/^rust-version *= *"/ {print $2; exit}' Cargo.toml)"
          if [ -z "$msrv" ]; then
            echo "::error title=MSRV::the workspace Cargo.toml declares no rust-version"
            exit 1
          fi
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: ${{ github.event_name == 'pull_request' }}
          key: msrv-${{ steps.msrv.outputs.version }}
      - name: cargo check on the declared rust-version
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+${MSRV}" check --workspace --all-features --locked

  # The differential suite runs each case against `xr` and against the Go
  # original, and it skips when `XURL_ORIGINAL_BIN` is unset, which is what the
  # reusable workflow's test job sees. This job is where the comparison
  # happens: it installs Go `xurl` at a pinned commit and names it in the
  # variable, and with the variable set a missing binary fails the suite
  # instead of skipping it. The cases that need the live API stay skipped, so
  # the job spends nothing. A warm run compares nothing, so it needs no Go `xurl`.
  parity:
    name: Go parity
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # xdevplatform/xurl v1.3.4
      GO_XURL_REV: 18dcb447f090667171ff23666a05d6d387e2aa73
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: ${{ github.event_name == 'pull_request' }}
      - name: Install Go xurl at the pinned commit
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          go version
          go install "github.com/xdevplatform/xurl@${GO_XURL_REV}"
          original="$(go env GOPATH)/bin/xurl"
          test -x "$original"
          echo "XURL_ORIGINAL_BIN=${original}" >> "$GITHUB_ENV"
      - name: Run the differential suite
        run: cargo test -p xurl-rs --test conformance_runner --locked ${{ env.TEST_NO_RUN }} -- --nocapture

  # The matrix above names the cells a reader expects; this job compiles every
  # remaining subset that carries a backend (`native-tls` with `testing`, both
  # backends without it), each from `--no-default-features`, so a feature added
  # later cannot break a pairing nobody listed. Subsets with no backend are
  # left out: the matrix asserts that failure by name. Compiling is the whole
  # check, so a warm run runs it as it is.
  feature-powerset:
    name: Feature powerset
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: ${{ github.event_name == 'pull_request' }}
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@81df5c23b0dc775b009efdfc9895c5965b7a4e40 # v1.26.1
      - name: Install cargo-hack
        # A second binstall attempt covers a transient release-asset fetch
        # failure; a source build is the fallback after that.
        run: |
          cargo binstall cargo-hack --force --no-confirm \
            || cargo binstall cargo-hack --force --no-confirm \
            || cargo install cargo-hack --locked
          cargo hack --version
      - name: cargo hack check
        run: cargo hack check -p xdk-rs --feature-powerset --at-least-one-of rustls,native-tls --exclude-no-default-features --locked

  # `anc audit` runs against the release binary because the behavioral rows
  # execute the CLI. The gate has two halves. First, any MUST-tier `fail` or
  # `error` fails the job. Second, the credit-weighted score must stay at or
  # above the committed floor: vocabulary drift (`p6`) reports as `warn`, which
  # a MUST-only gate never sees, so the floor is what catches it. A command
  # word that is X's own vocabulary goes in `.anc.toml`'s `domain_verbs`.
  # Raise the floor deliberately when the score improves.
  #
  # The floor is the score the audit reports for this tree. Four rows do not
  # pass:
  #
  # - `p2-must-output-flag` (warn): anc validates JSON only through `--help`
  #   and `--version`, and `xr` prints both as clap's own text whatever
  #   `--output` says. `xr version --output json` is the JSON form.
  # - `p6-should-consistent-naming` (warn): noun groups such as `auth`,
  #   `media`, `calls`, and `webhooks` hold verbs beside names anc does not
  #   count as verbs (`auth oauth2`, `media upload`). Regrouping a released
  #   command renames it, which is a breaking change. The row warns once
  #   however many groups it names.
  # - `p1-must-no-interactive` (skip): anc skips the flag check for a tool
  #   that prints its help on a bare invocation, as `xr` does.
  # - `p2-should-consistent-envelope` (skip): the success probe is `--help
  #   --output json`, which prints text for the reason the first row gives.
  #
  # anc is pinned to ANC_VERSION. A new anc release can add rows or change how
  # one scores, so it reaches this gate only through a PR that bumps the pin
  # and settles the score and the floor together.
  #
  # The same job checks the release binary's size against a standing ceiling.
  # Cargo honors [profile.release] only in the workspace root, and a profile
  # that silently stops applying inflates `xr` several times over while every
  # test stays green; the ceiling turns that into a red job. With every
  # command family the release `xr` measures about 12.6 MB, and a dropped
  # `strip` alone roughly doubles it, so the ceiling leaves room for ordinary
  # growth and none for a lost profile.
  #
  # A warm run builds the release binary and skips everything that grades it.
  anc:
    name: Agent-native audit
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANC_VERSION: "0.6.0"
      ANC_SCORE_FLOOR: "98"
      XR_SIZE_CEILING_BYTES: "15000000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: ${{ github.event_name == 'pull_request' }}
      - name: Install cargo-binstall
        if: github.event_name == 'pull_request'
        uses: cargo-bins/cargo-binstall@81df5c23b0dc775b009efdfc9895c5965b7a4e40 # v1.26.1
      - name: Install anc
        if: github.event_name == 'pull_request'
        # A second binstall attempt covers a transient release-asset fetch
        # failure; a source build is the fallback after that.
        run: |
          cargo binstall "agentnative@${ANC_VERSION}" --force --no-confirm \
            || cargo binstall "agentnative@${ANC_VERSION}" --force --no-confirm \
            || cargo install "agentnative@${ANC_VERSION}" --locked
          installed="$(anc --version)"
          echo "${installed} (pinned ${ANC_VERSION})"
          if [ "$installed" != "anc ${ANC_VERSION}" ]; then
            echo "::error title=Install anc::found '${installed}' on PATH, expected anc ${ANC_VERSION}"
            exit 1
          fi
      - name: Build the release binary
        run: cargo build --release --locked --bin xr
      - name: Release binary size ceiling
        if: github.event_name == 'pull_request'
        run: |
          size="$(stat -c %s target/release/xr)"
          echo "target/release/xr is ${size} bytes (ceiling ${XR_SIZE_CEILING_BYTES})"
          if [ "$size" -gt "$XR_SIZE_CEILING_BYTES" ]; then
            echo "::error title=Release binary size::xr is ${size} bytes, over the ${XR_SIZE_CEILING_BYTES}-byte ceiling; check that [profile.release] still applies from the workspace root"
            exit 1
          fi
      - name: anc audit
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # anc exits 0 when every audit passes, 1 when warnings are present
          # without failures, and 2 on failures, errors or usage errors. Each of
          # the three is read from the scorecard below, whose shape check
          # rejects a usage error's output; any other exit means the audit never
          # ran (unreachable binary, crash) and fails outright.
          status=0
          anc audit --command target/release/xr --output json > anc-scorecard.json || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ] && [ "$status" -ne 2 ]; then
            echo "::error title=anc audit::anc audit exited ${status} without a verdict"
            exit 1
          fi
          # A scorecard without a numeric score or a results array is not a
          # verdict either; jq -e turns a missing or retyped key into a failure.
          jq -e '(.badge.score_pct | type == "number") and (.results | type == "array" and length > 0)' anc-scorecard.json > /dev/null
          jq -r '.results[] | "\(.tier)\t\(.status)\t\(.id)"' anc-scorecard.json | sort > anc-rows.tsv
          score="$(jq -r '.badge.score_pct' anc-scorecard.json)"
          skips="$(jq -r '[.results[] | select(.status == "skip")] | length' anc-scorecard.json)"
          echo "anc score: ${score}% (floor ${ANC_SCORE_FLOOR}%), ${skips} row(s) skipped"
          # `error` rows are excluded from the score denominator, so a harness
          # that cannot execute the binary would otherwise pass at score 100.
          must_fails="$(jq -r '[.results[] | select(.tier == "must" and (.status == "fail" or .status == "error")) | .id] | join(", ")' anc-scorecard.json)"
          if [ -n "$must_fails" ]; then
            echo "::error title=anc audit::MUST-tier failures: ${must_fails}"
            exit 1
          fi
          if ! jq -e --argjson floor "$ANC_SCORE_FLOOR" '.badge.score_pct >= $floor' anc-scorecard.json > /dev/null; then
            echo "::error title=anc audit::score ${score}% is below the ${ANC_SCORE_FLOOR}% floor"
            exit 1
          fi
      - name: Upload the scorecard
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anc-scorecard
          path: |
            anc-scorecard.json
            anc-rows.tsv
