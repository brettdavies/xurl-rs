# Source repo CI wrapper — calls the centralized reusable workflow.
#
# The reusable workflow runs: fmt, clippy, test, cargo-deny check, package check,
# Windows dep check, and changelog verification (on PRs to main).
# No secrets required — only needs contents: read and pull-requests: read.
#
# pull_request only: merges to main and dev are squash merges, so the merge
# commit's tree equals the PR head this workflow already verified, and a push
# run would re-check an identical tree for no new signal. The compensating
# local gate is the hook pair at scripts/hooks/, which mirrors these jobs
# before the push leaves the machine.
name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

# The group key leads with a literal token naming this workflow. A key built
# only from context (`${{ github.workflow }}`) is one the reusable called below
# also produces, because `github.workflow` resolves to this caller's name inside
# a called workflow; both then land in one group and the reusable's queue
# cancels this run. The reusable carries its own `rust-ci-` token for its jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: brettdavies/.github/.github/workflows/rust-ci.yml@main
    with:
      # An advisory turns this run red rather than leaving it green with one
      # failed job. The ruleset already blocks the merge; this is so the run's
      # colour matches what a human scanning the Actions tab should act on.
      advisories_blocking: true

  # actionlint + markdownlint from the org reusable. The markdownlint glob set
  # matches scripts/hooks/pre-push step 10 verbatim, so the hook and this job
  # cannot reach different verdicts. CHANGELOG.md is generated by git-cliff and
  # wraps where the generator wraps; .claude/ is a gitignored symlink to the
  # global template store, absent from this checkout and linted at its source.
  lint:
    uses: brettdavies/.github/.github/workflows/lint-basics.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      markdownlint-globs: |
        **/*.md
        !CHANGELOG.md
        !.claude/**

  lint-stdio:
    name: Output discipline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run scripts/lint-stdio.sh
        run: bash scripts/lint-stdio.sh
      - name: Check concurrency group namespacing
        run: bash scripts/lint-workflow-concurrency.sh

  # Docs build with warnings denied; a broken intra-doc link or bad code
  # fence fails here instead of surfacing after publish. Two builds: stable
  # is what `cargo doc` gives a consumer, and nightly with `--cfg docsrs` is
  # what docs.rs runs, the only toolchain that accepts the `doc_cfg` feature
  # the library enables under that cfg to render feature badges.
  docs:
    name: Doc build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install nightly Rust for the docs.rs build
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --workspace --no-deps --locked
      - name: cargo doc as docs.rs builds it
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: cargo +nightly doc -p xdk-rs --no-deps --all-features --locked

  # A textual diff of the library sources cannot answer whether the public API
  # broke: it misses pub fields, consts, type aliases, and traits. This reads
  # rustdoc JSON and applies Rust's own semver rules against the library's last
  # released tag, which is what consumers actually have. Comparing against `dev`
  # instead would flag churn on unreleased code that no consumer ever saw.
  #
  # Only `xdk-rs` is checked: the `xr` crate's library target exists for its own
  # tests and is not consumed. The baseline is the newest `xdk-rs-v*` tag; the
  # CLI's `v*` tags sort into the same list and would baseline the wrong crate.
  # Before the first library release no such tag exists, so the check reports
  # that it skipped rather than failing every PR on a missing baseline.
  #
  # `release-type: minor` asks the question worth blocking on: does this need a
  # major? A break the project accepts into a minor carries a required-update
  # entry in crates/xdk/Cargo.toml under
  # [package.metadata.cargo-semver-checks.lints], reviewed alongside the diff
  # that takes it.
  semver:
    name: Public API semver
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The baseline is a tag, which the default shallow fetch omits.
          fetch-depth: 0
      - name: Resolve the library's last release tag
        id: baseline
        run: |
          tag="$(git tag -l 'xdk-rs-v*' --sort=-version:refname | head -n 1)"
          if [ -z "$tag" ]; then
            echo "::notice title=Public API semver::skipped: no xdk-rs-v* tag exists yet, so there is no released baseline to compare against"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: cargo semver-checks
        if: steps.baseline.outputs.tag != ''
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: xdk-rs
          baseline-rev: ${{ steps.baseline.outputs.tag }}
          release-type: minor

  # completions/ is generated from the clap definition; --check fails when a
  # CLI surface or clap_complete change lands without regenerating.
  completions:
    name: Completions freshness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Verify completions match the CLI definition
        run: ./scripts/generate-completions.sh --check

  # A package-scoped test run proves nothing about an out-of-package consumer,
  # so an embedder-shaped crate compiles and runs a read against the
  # documented surface; hiding or removing something it relies on fails here
  # before it fails a user's build.
  consumer:
    name: Consumer check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build and run the consumer crate's read
        run: cargo test -p xdk-consumer-check --locked

  # Cargo features are additive: `--features native-tls` on top of the default
  # set compiles both backends together and never shows that native-tls stands
  # alone, so every "this backend by itself" cell starts from
  # `--no-default-features`. The cell with no backend at all is expected to
  # fail, and it asserts on the guard's message so a build that fails for any
  # other reason still turns the cell red. The two cells that also run the
  # tests are the ones whose feature set the default `ci` job never sees.
  features:
    name: Features (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            flags: ""
          - name: rustls only
            flags: --no-default-features --features rustls
          - name: native-tls only
            flags: --no-default-features --features native-tls
          - name: no TLS backend
            flags: --no-default-features
            must_fail: true
          - name: all features
            flags: --all-features
            test: true
          - name: testing
            flags: --features testing
            test: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}
      - name: cargo check
        if: ${{ !matrix.must_fail }}
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          read -ra flags <<< "$FLAGS"
          cargo check -p xdk-rs --all-targets --locked "${flags[@]}"
      - name: cargo test
        if: ${{ matrix.test }}
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          read -ra flags <<< "$FLAGS"
          cargo test -p xdk-rs --locked "${flags[@]}"
      - name: cargo check must fail on the TLS guard
        if: ${{ matrix.must_fail }}
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          read -ra flags <<< "$FLAGS"
          if cargo check -p xdk-rs --locked "${flags[@]}" 2> check.log; then
            echo "::error title=Features::a build with no TLS backend compiled; the compile_error! guard in crates/xdk/src/lib.rs is gone"
            exit 1
          fi
          if ! grep -F "needs a TLS backend" check.log; then
            echo "::error title=Features::the no-backend build failed, but not on the TLS guard"
            cat check.log
            exit 1
          fi

  # The matrix above names the cells a reader expects; this job compiles every
  # remaining subset that carries a backend (`native-tls` with `testing`, both
  # backends without it), each from `--no-default-features`, so a feature added
  # later cannot break a pairing nobody listed. Subsets with no backend are
  # left out: the matrix asserts that failure by name.
  feature-powerset:
    name: Feature powerset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0
      - name: Install cargo-hack
        # A second binstall attempt covers a transient release-asset fetch
        # failure; a source build is the fallback after that.
        run: |
          cargo binstall cargo-hack --force --no-confirm \
            || cargo binstall cargo-hack --force --no-confirm \
            || cargo install cargo-hack --locked
          cargo hack --version
      - name: cargo hack check
        run: cargo hack check -p xdk-rs --feature-powerset --at-least-one-of rustls,native-tls --exclude-no-default-features --locked

  # `anc audit` runs against the release binary because the behavioral rows
  # execute the CLI. The gate has two halves. First, any MUST-tier `fail` other
  # than `p2-must-json-errors` fails the job; that one id is exempt because its
  # fix (top-level `error`/`kind` keys on the JSON envelope) belongs to the
  # 3.3.0 output-shape release, and a MUST-only gate would otherwise be red from
  # its first run. Second, the credit-weighted score must stay at or above the
  # committed floor: vocabulary drift (`p6`) reports as `warn`, which a
  # MUST-only gate never sees, so the floor is what catches it. Raise the floor
  # deliberately when the score improves.
  #
  # The same job checks the release binary's size against a standing ceiling.
  # Cargo honors [profile.release] only in the workspace root, and a profile
  # that silently stops applying inflates `xr` several times over while every
  # test stays green; the ceiling turns that into a red job. The release `xr`
  # measures 7,727,512 bytes and a dropped `strip` alone roughly doubles it,
  # so the ceiling leaves room for ordinary growth and none for a lost profile.
  anc:
    name: Agent-native audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANC_SCORE_FLOOR: "94"
      ANC_EXEMPT_ID: p2-must-json-errors
      XR_SIZE_CEILING_BYTES: "9600000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0
      - name: Install anc
        # A second binstall attempt covers a transient release-asset fetch
        # failure; a source build is the fallback after that.
        run: |
          cargo binstall agentnative --force --no-confirm \
            || cargo binstall agentnative --force --no-confirm \
            || cargo install agentnative --locked
          anc --version
      - name: Build the release binary
        run: cargo build --release --locked --bin xr
      - name: Release binary size ceiling
        run: |
          size="$(stat -c %s target/release/xr)"
          echo "target/release/xr is ${size} bytes (ceiling ${XR_SIZE_CEILING_BYTES})"
          if [ "$size" -gt "$XR_SIZE_CEILING_BYTES" ]; then
            echo "::error title=Release binary size::xr is ${size} bytes, over the ${XR_SIZE_CEILING_BYTES}-byte ceiling; check that [profile.release] still applies from the workspace root"
            exit 1
          fi
      - name: anc audit
        run: |
          set -euo pipefail
          # anc exits 2 when any MUST-tier row fails, the exempt id included,
          # so exit 2 is read from the scorecard; any other non-zero exit means
          # the audit never ran (unreachable binary, crash) and fails outright.
          status=0
          anc audit --command target/release/xr --output json > anc-scorecard.json || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "::error title=anc audit::anc audit exited ${status} without a verdict"
            exit 1
          fi
          # A scorecard without a numeric score or a results array is not a
          # verdict either; jq -e turns a missing or retyped key into a failure.
          jq -e '(.badge.score_pct | type == "number") and (.results | type == "array" and length > 0)' anc-scorecard.json > /dev/null
          jq -r '.results[] | "\(.tier)\t\(.status)\t\(.id)"' anc-scorecard.json | sort > anc-rows.tsv
          score="$(jq -r '.badge.score_pct' anc-scorecard.json)"
          skips="$(jq -r '[.results[] | select(.status == "skip")] | length' anc-scorecard.json)"
          echo "anc score: ${score}% (floor ${ANC_SCORE_FLOOR}%), ${skips} row(s) skipped"
          # `error` rows are excluded from the score denominator, so a harness
          # that cannot execute the binary would otherwise pass at score 100.
          must_fails="$(jq -r --arg exempt "$ANC_EXEMPT_ID" '[.results[] | select(.tier == "must" and (.status == "fail" or .status == "error") and .id != $exempt) | .id] | join(", ")' anc-scorecard.json)"
          if [ -n "$must_fails" ]; then
            echo "::error title=anc audit::MUST-tier failures: ${must_fails}"
            exit 1
          fi
          if ! jq -e --argjson floor "$ANC_SCORE_FLOOR" '.badge.score_pct >= $floor' anc-scorecard.json > /dev/null; then
            echo "::error title=anc audit::score ${score}% is below the ${ANC_SCORE_FLOOR}% floor"
            exit 1
          fi
      - name: Upload the scorecard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: anc-scorecard
          path: |
            anc-scorecard.json
            anc-rows.tsv
