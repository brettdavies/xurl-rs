# Source repo CI wrapper — calls the centralized reusable workflow.
# Copy to .github/workflows/ci.yml in the tool repo.
#
# The reusable workflow runs: fmt, clippy, test, cargo-deny check, package check,
# Windows dep check, and changelog verification (on PRs to main).
# No secrets required — only needs contents: read and pull-requests: read.
#
# Push trigger is scoped to main/dev only — feature branches get CI via
# pull_request. This prevents duplicate runs when a branch push and PR
# creation fire seconds apart. tags-ignore prevents CI on release tag pushes
# (the release workflow handles those). paths-ignore skips doc-only pushes.
# paths-ignore is NOT applied to pull_request to avoid blocking required
# status checks when a PR only touches ignored paths.
name: CI

on:
  push:
    branches: [main, dev]
    tags-ignore: ['**']
    paths-ignore:
      - '**.md'
      - 'LICENSE-*'
      - 'docs/**'
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    uses: brettdavies/.github/.github/workflows/rust-ci.yml@main
    with:
      # An advisory turns this run red rather than leaving it green with one
      # failed job. The ruleset already blocks the merge; this is so the run's
      # colour matches what a human scanning the Actions tab should act on.
      advisories_blocking: true

  lint-stdio:
    name: Output discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run scripts/lint-stdio.sh
        run: bash scripts/lint-stdio.sh

  # docs.rs builds with warnings denied; a broken intra-doc link or bad code
  # fence fails here instead of surfacing after publish.
  docs:
    name: Doc build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

  # A textual diff of src/ cannot answer whether the public API broke: it misses
  # pub fields, consts, type aliases, and traits. This reads rustdoc JSON and
  # applies Rust's own semver rules against the last released tag, which is what
  # consumers actually have. Comparing against `dev` instead would flag churn on
  # unreleased code that no consumer ever saw.
  #
  # `release-type: minor` asks the question worth blocking on: does this need a
  # major? A break the project accepts into a minor carries a required-update
  # entry in Cargo.toml under [package.metadata.cargo-semver-checks.lints],
  # reviewed alongside the diff that takes it.
  semver:
    name: Public API semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The baseline is a tag, which the default shallow fetch omits.
          fetch-depth: 0
      - name: Resolve the last release tag
        id: baseline
        run: echo "tag=$(git tag --sort=-version:refname | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: cargo semver-checks
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          baseline-rev: ${{ steps.baseline.outputs.tag }}
          release-type: minor

  # completions/ is generated from the clap definition; --check fails when a
  # CLI surface or clap_complete change lands without regenerating.
  completions:
    name: Completions freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Verify completions match the CLI definition
        run: ./scripts/generate-completions.sh --check
