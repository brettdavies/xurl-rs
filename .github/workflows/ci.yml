# Source repo CI wrapper — calls the centralized reusable workflow.
#
# The reusable workflow runs: fmt, clippy, test, cargo-deny check, package check,
# Windows dep check, and changelog verification (on PRs to main).
# No secrets required — only needs contents: read and pull-requests: read.
#
# pull_request only: merges to main and dev are squash merges, so the merge
# commit's tree equals the PR head this workflow already verified, and a push
# run would re-check an identical tree for no new signal. The compensating
# local gate is the hook pair at scripts/hooks/, which mirrors these jobs
# before the push leaves the machine.
name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

# The group key leads with a literal token naming this workflow. A key built
# only from context (`${{ github.workflow }}`) is one the reusable called below
# also produces, because `github.workflow` resolves to this caller's name inside
# a called workflow; both then land in one group and the reusable's queue
# cancels this run. The reusable carries its own `rust-ci-` token for its jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each job installs the toolchain rust-toolchain.toml names, through rustup.
# Line tables keep file and line in a failing test's backtrace while cutting a
# cold build by about 40% and the target directory by more than half against
# full debug info. Incremental artifacts only add weight to a cached CI build.
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always

jobs:
  # Whether this PR can reach cargo at all. A PR whose every path is
  # documentation no Rust source reads (scripts/cargo-inputs.sh, the filter
  # the pre-push hook also applies) skips every Rust job below; `lint` still
  # runs. A job skipped by its condition reports success, so the required
  # checks pass. Each Rust job runs unless this job answered `false`, so a
  # scope job that fails or never reports runs the full battery instead of
  # skipping it.
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      # The checkout is GitHub's test merge of the PR into its base, so the
      # diff against its first parent is exactly what the PR changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Classify the changed paths
        id: scope
        run: |
          set -euo pipefail
          inputs="$(git diff --no-renames --name-only HEAD^1 HEAD | bash scripts/cargo-inputs.sh)"
          if [ -n "$inputs" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            printf 'Paths that reach cargo:\n%s\n' "$inputs"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Change scope::every changed path is documentation no Rust source reads, so the Rust jobs skip"
          fi

  ci:
    needs: scope
    if: ${{ !cancelled() }}
    uses: brettdavies/.github/.github/workflows/rust-ci.yml@feat/rust-ci-tier-inputs
    with:
      # An advisory turns this run red rather than leaving it green with one
      # failed job. The ruleset already blocks the merge; this is so the run's
      # colour matches what a human scanning the Actions tab should act on.
      advisories_blocking: true
      docs_only: ${{ needs.scope.outputs.rust == 'false' }}
      # PROBE-INPUTS
      warm_cache: true
