# Source repo release wrapper — calls the centralized reusable workflow.
#
# Pipeline: check-version -> build (7 targets) -> crates.io -> release (non-draft) ->
# homebrew bottle build -> bottles upload back to release assets -> finalize-release
# marks the release final.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write

jobs:
  pipeline:
    uses: brettdavies/.github/.github/workflows/rust-release.yml@main
    with:
      crate: xurl-rs
      bin: xr
      # Each crate keeps its changelog beside its own manifest, so the release
      # notes are not at the repository root the reusable defaults to.
      changelog: crates/xurl-cli/CHANGELOG.md
      # Both musl rows build clean (verified by release-matrix-check), so a
      # musl failure now blocks the release instead of silently omitting two
      # artifacts from it.
      linux_musl_required: true
    secrets:
      CI_RELEASE_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
