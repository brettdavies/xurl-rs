# Source repo release wrapper — calls the centralized reusable workflow.
# Copy to .github/workflows/release.yml in the tool repo.
#
# Pipeline: check-version -> build (7 targets) -> attest (build provenance, and a
# CycloneDX SBOM of the binary) -> crates.io -> release (visible, not latest) ->
# verify the published files against their attestations -> homebrew-tap tests the
# formula bump from the archives and lands it -> finalize-release marks the
# release latest.
#
# The `build` job is the only place a release compiles its binaries. The tap
# installs the published archives and builds no bottle.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  # The reusable workflow's attest job takes this from the caller.
  attestations: write

jobs:
  pipeline:
    uses: brettdavies/.github/.github/workflows/rust-release.yml@main
    with:
      crate: xurl-rs
      bin: xr
      # Each crate keeps its changelog beside its own manifest, so the release
      # notes are not at the repository root the reusable defaults to.
      changelog: crates/xurl-cli/CHANGELOG.md
      # A musl failure blocks the release instead of silently omitting two
      # archives from it. release-matrix-check.yml builds both rows before a
      # tag exists.
      linux_musl_required: true
      # A Homebrew formula that installs release archives needs this: the tap
      # verifies each archive against its attestation before it pins the
      # checksum, so a release without attestations never reaches Homebrew.
      attest: true
    secrets:
      CI_RELEASE_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
