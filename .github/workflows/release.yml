# Source repo release wrapper — calls the centralized reusable workflow.
#
# Pipeline: check-version -> build (7 targets) -> crates.io -> release (non-draft) ->
# homebrew bottle build -> bottles upload back to release assets -> finalize-release
# marks the release final.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write

jobs:
  pipeline:
    # Pinned to the upstream commit whose check-version refuses a release whose
    # workspace bound is not on crates.io (brettdavies/.github#64) until it
    # merges; repoint to `@main` after the merge.
    uses: brettdavies/.github/.github/workflows/rust-release.yml@fd2f59d07e02e7d37a7475238cd51cbb70ea45a1 # feat/rust-release-workspace-bounds
    with:
      crate: xurl-rs
      bin: xr
      # Both musl rows build clean (verified by release-matrix-check), so a
      # musl failure now blocks the release instead of silently omitting two
      # artifacts from it.
      linux_musl_required: true
    secrets:
      CI_RELEASE_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
