# Builds every target the release matrix builds, without releasing anything.
#
# The release build only runs on a `v*` tag push, so a dependency that breaks a
# cross-compiled target is discovered while cutting the release. That is the
# wrong moment: the tag exists, and the fix lands after a failed publish.
#
# This runs the same seven targets on demand and on any change to the
# dependency graph or the toolchain pin, which is what breaks cross builds.
# reqwest 0.13 brought in aws-lc-sys, which compiles C and needs a working
# cross toolchain per target; a change of that shape reaches this workflow
# before it reaches a tag.
#
# Every row is hard-fail here. The release workflow soft-fails its two musl
# rows and omits their artifacts, so a red musl row in this check means
# "investigate before tagging", not "the release will fail".
name: Release matrix check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/release-matrix-check.yml
  push:
    branches: [dev]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml

permissions:
  contents: read

concurrency:
  group: release-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            cross: true
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            cross: true
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      # dtolnay/rust-toolchain honors rust-toolchain.toml's channel but installs
      # only the host default target, so the matrix target is re-added
      # explicitly. Skipped for cross rows, whose docker image carries its own
      # pre-configured toolchain.
      - name: Ensure target installed
        if: matrix.cross != true
        run: rustup target add ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-matrix-${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall cross --version 0.2.5 --no-confirm --force

      - name: Build release
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.cross }}
        run: |
          BUILD_CMD="cargo"
          if [ "$USE_CROSS" = "true" ]; then
            BUILD_CMD="cross"
          fi
          $BUILD_CMD build --release --locked --target "$TARGET"
