# Detects drift between the vendored X OpenAPI spec at
# vendor/x-api-openapi.json and the live upstream at api.x.com/2/openapi.json.
#
# Triggers:
#   - schedule: daily 09:00 UTC — opens (or updates) a refresh PR to dev
#     carrying the new vendored spec on divergence; never merges it
#   - workflow_dispatch: manual re-run
#   - pull_request: only when the vendor/build/matrix surface changes —
#     surface drift in the PR before the matrix takes a stale snapshot
#
# The schedule/dispatch path pushes the refresh branch and opens the PR with
# CI_RELEASE_TOKEN (a GITHUB_TOKEN push would not trigger CI on the PR); the
# PR run can comment on the PR with the workflow token. Non-blocking on
# every trigger — drift is informational, not gating; a human reviews and
# merges the refresh PR.
name: Spec Drift

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'vendor/x-api-openapi.json'
      - 'build.rs'
      - 'src/api/auth_matrix.rs'

permissions:
  contents: read

jobs:
  check:
    name: Compare vendored spec against upstream
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      UPSTREAM_URL: https://api.x.com/2/openapi.json
      VENDOR_PATH: vendor/x-api-openapi.json
      REFRESH_BRANCH: spec-refresh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch upstream spec (with retry)
        id: fetch
        run: |
          set -uo pipefail
          tmp="$(mktemp)"
          echo "tmp=${tmp}" >> "$GITHUB_OUTPUT"
          # Up to 3 attempts with linear backoff. curl --fail returns non-zero
          # on 4xx/5xx; --max-time bounds slow responses.
          attempt=0
          while [ $attempt -lt 3 ]; do
            attempt=$((attempt + 1))
            if curl -sS --fail --max-time 60 -o "${tmp}" "${UPSTREAM_URL}"; then
              echo "fetched=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "attempt ${attempt} failed; sleeping $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "fetched=0" >> "$GITHUB_OUTPUT"

      - name: Report unreachable upstream
        if: steps.fetch.outputs.fetched != '1'
        run: |
          {
            echo "## Spec drift: upstream unreachable"
            echo ""
            echo "Could not fetch \`${UPSTREAM_URL}\` after 3 attempts."
            echo "This is informational; the vendored spec is unchanged."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate fetched spec is JSON
        if: steps.fetch.outputs.fetched == '1'
        id: validate
        run: |
          set -uo pipefail
          if jq -e '.info.version' "${{ steps.fetch.outputs.tmp }}" > /dev/null 2>&1; then
            echo "valid=1" >> "$GITHUB_OUTPUT"
          else
            echo "valid=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Report invalid upstream response
        if: steps.fetch.outputs.fetched == '1' && steps.validate.outputs.valid != '1'
        run: |
          {
            echo "## Spec drift: upstream returned non-JSON"
            echo ""
            echo "\`${UPSTREAM_URL}\` returned a payload that does not parse"
            echo "as JSON or lacks \`.info.version\`. Treating as transient;"
            echo "the vendored spec is unchanged."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compare against vendored
        if: steps.fetch.outputs.fetched == '1' && steps.validate.outputs.valid == '1'
        id: diff
        run: |
          set -uo pipefail
          tmp='${{ steps.fetch.outputs.tmp }}'
          # Both sides run through the canonicalizer: the endpoint shuffles
          # OAuth scope arrays per request, and a vendored copy written
          # before normalization existed must not read as drift either.
          if cmp -s \
            <(scripts/normalize-x-openapi.sh "${VENDOR_PATH}") \
            <(scripts/normalize-x-openapi.sh "${tmp}"); then
            echo "drift=0" >> "$GITHUB_OUTPUT"
          else
            echo "drift=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Report no drift
        if: steps.diff.outputs.drift == '0'
        run: |
          {
            echo "## Spec drift: none"
            echo ""
            echo "Vendored spec matches upstream byte-for-byte."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build drift report body
        if: steps.diff.outputs.drift == '1'
        id: body
        run: |
          set -uo pipefail
          body_file="$(mktemp)"
          # All diff + render logic lives in scripts/diff-x-openapi-spec.sh
          # so the same code drives the workflow comment, scheduled-issue
          # body, manual local diffs, and any pre-push integration.
          scripts/diff-x-openapi-spec.sh \
            "${VENDOR_PATH}" \
            "${{ steps.fetch.outputs.tmp }}" \
            "${UPSTREAM_URL}" \
            > "${body_file}"
          echo "body_file=${body_file}" >> "$GITHUB_OUTPUT"
          {
            echo "## Spec drift detected"
            echo ""
            cat "${body_file}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: steps.diff.outputs.drift == '1' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          # The drift check runs for every trigger path, but the comment is
          # only about the PR when the PR itself changes the vendored spec;
          # on a build.rs or auth-matrix PR it reads as off-topic noise.
          touches_vendor="$(gh pr view "${PR_NUMBER}" --json files --jq '[.files[].path] | any(. == "vendor/x-api-openapi.json")')"
          if [ "${touches_vendor}" != "true" ]; then
            echo "Drift exists but this PR does not change the vendored spec; no comment posted." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Marker upsert: a long-lived PR gets one drift comment edited in
          # place, not a stack of one per push.
          marker='<!-- spec-drift-pr-comment -->'
          comment="$(mktemp)"
          {
            echo "${marker}"
            echo ""
            cat "${{ steps.body.outputs.body_file }}"
          } > "${comment}"
          cid="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"${marker}\"))][0].id // empty")"
          if [ -n "${cid}" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${cid}" -F body=@"${comment}" > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@"${comment}" > /dev/null
          fi

      # A human-owned refresh PR (different head) wins and this run stands
      # down; the workflow's own branch gets force-pushed and its PR
      # updated. Deduped by title match across any head branch.
      - name: Find open refresh PR
        id: dedupe
        if: steps.diff.outputs.drift == '1' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # The list API reflects a just-created PR immediately, where the
          # search index lags minutes behind and can miss it.
          existing="$(gh pr list \
            --state open --base dev \
            --json number,headRefName,title \
            --jq '[.[] | select(.title | test("refresh vendored X API spec"))][0] // empty')"
          if [ -z "${existing}" ]; then
            echo "mode=create" >> "$GITHUB_OUTPUT"
          else
            existing_num="$(jq -r '.number' <<<"${existing}")"
            existing_head="$(jq -r '.headRefName' <<<"${existing}")"
            echo "number=${existing_num}" >> "$GITHUB_OUTPUT"
            if [ "${existing_head}" = "${REFRESH_BRANCH}" ]; then
              echo "mode=update" >> "$GITHUB_OUTPUT"
            else
              echo "mode=standdown" >> "$GITHUB_OUTPUT"
              echo "Open refresh PR #${existing_num} (head \`${existing_head}\`) already covers the drift; not opening another." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Open or update spec refresh PR
        if: steps.diff.outputs.drift == '1' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.dedupe.outputs.mode != 'standdown'
        env:
          GH_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
        run: |
          set -uo pipefail
          upstream_version="$(jq -r '.info.version' "${{ steps.fetch.outputs.tmp }}")"
          title="feat(spec): refresh vendored X API spec to upstream ${upstream_version}"
          existing_num='${{ steps.dedupe.outputs.number }}'

          # The drift gate compares against this run's own ref (main on the
          # cron), but the PR lands on dev, so the refresh branch is cut from
          # origin/dev. The no-change guard below stands down when dev
          # already carries the upstream revision.
          git fetch --depth 1 origin dev:refs/remotes/origin/dev
          git switch -c "${REFRESH_BRANCH}" origin/dev
          # The gate's report compared against this run's own ref (main on
          # the cron); the body's detail regenerates here against dev, the
          # revision this PR actually changes.
          body_dev="$(mktemp)"
          scripts/diff-x-openapi-spec.sh "${VENDOR_PATH}" "${{ steps.fetch.outputs.tmp }}" "${UPSTREAM_URL}" > "${body_dev}"
          scripts/refresh-x-openapi.sh
          # The refresh is script-only by design: the auth-method matrix
          # regenerates from the vendored spec inside the opened PR's own CI
          # build, which fails there if a shortcut template no longer
          # resolves, and schema/responses/ derives from crate types a
          # spec-only change cannot move.
          git add vendor/

          if git diff --cached --quiet; then
            echo "Refresh produced no change against dev; nothing to open." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # shellcheck disable=SC2016 # backticks are literal markdown
          changed_files="$(git diff --cached --name-only | sed 's/^/- `/; s/$/`/')"

          # dev requires verified signatures, so the commit is created with
          # the createCommitOnBranch mutation: GitHub signs commits it
          # creates, where a workflow-side git commit stays unsigned and
          # unmergeable.
          result=""
          dev_sha="$(git rev-parse origin/dev)"
          if [ -n "${existing_num}" ]; then
            # Update stacks the new commit on the branch head: resetting the
            # branch to the dev tip first would momentarily empty the PR,
            # and GitHub auto-closes a PR whose head reaches its base.
            git fetch --depth 1 origin "${REFRESH_BRANCH}:refs/remotes/origin/${REFRESH_BRANCH}"
            head_sha="$(git rev-parse "refs/remotes/origin/${REFRESH_BRANCH}")"
            if git diff --cached --quiet "refs/remotes/origin/${REFRESH_BRANCH}" -- vendor/; then
              result="current"
              echo "Open refresh PR #${existing_num} already carries this upstream revision; branch content untouched." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            head_sha="${dev_sha}"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${REFRESH_BRANCH}" -f sha="${dev_sha}" >/dev/null 2>&1 \
              || gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${REFRESH_BRANCH}" \
                -f sha="${dev_sha}" -F force=true >/dev/null
          fi

          if [ -z "${result}" ]; then
            # File contents route through files, never argv: a single
            # argument caps at 128KB on Linux and the base64 spec is ~1.2MB.
            additions_file="$(mktemp)"
            git diff --cached --name-only | while IFS= read -r f; do
              b64="$(mktemp)"
              base64 -w0 "$f" > "${b64}"
              jq -n --arg p "$f" --rawfile c "${b64}" '{path: $p, contents: $c}'
            done | jq -s . > "${additions_file}"
            payload="$(mktemp)"
            jq -n \
              --arg repo "${GITHUB_REPOSITORY}" \
              --arg branch "${REFRESH_BRANCH}" \
              --arg head "${head_sha}" \
              --arg msg "${title}" \
              --slurpfile additions "${additions_file}" \
              '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
                variables: {input: {branch: {repositoryNameWithOwner: $repo, branchName: $branch}, expectedHeadOid: $head, message: {headline: $msg}, fileChanges: {additions: $additions[0]}}}}' \
              > "${payload}"
            # GraphQL returns HTTP 200 with an errors array, so a swallowed
            # response hides a failed mutation.
            resp="$(mktemp)"
            gh api graphql --input "${payload}" > "${resp}"
            if jq -e '.errors' "${resp}" >/dev/null 2>&1; then
              echo "createCommitOnBranch failed:" >&2
              jq -r '.errors[].message' "${resp}" >&2
              exit 1
            fi
          fi

          # The body is an agent runbook, not the repo PR template: the
          # agent that reconciles the codebase rewrites it to
          # .github/pull_request_template.md when the PR is merge-ready. The
          # marker on the first line records that the workflow still owns
          # the body; the tail below rewrites only marker-owned bodies on a
          # no-change run, so an agent's template rewrite survives until a
          # real content update invalidates the reconciliation.
          body_marker='<!-- spec-drift-runbook -->'
          pr_body="$(mktemp)"
          {
            echo "${body_marker}"
            echo ""
            echo "## Spec refresh (agent runbook)"
            echo ""
            echo "You are the reconciling agent for this spec refresh. Executing this runbook is the deliverable; a review or a report is not. This PR vendors upstream ${upstream_version}; the diff carries only vendored artifacts, and the codebase must be reconciled to them on this branch before merge."
            echo ""
            echo "Latest workflow pass: [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) on $(date -u +%Y-%m-%d)."
            echo ""
            echo "### Files in this PR"
            echo ""
            printf '%s\n' "${changed_files}"
            echo ""
            echo "### Drift detail"
            echo ""
            cat "${body_dev}"
            echo ""
            echo "### Automated gates (this PR's CI)"
            echo ""
            echo "- \`cargo build\` regenerates the auth-method matrix from the new spec; a build panic names a shortcut template that no longer resolves. Update the endpoint in \`src/api/shortcuts.rs\` and the \`SHORTCUT_TEMPLATES\` allowlist in \`src/api/auth_matrix.rs\`."
            echo "- \`tests/spec_types_validation.rs\` fails when a typed response still declares a field, or maps a component schema, that the spec renamed or removed. \`ALLOWED_DIVERGENCES\` applies only to field-level divergences with a documented upstream reason; it cannot suppress a missing component schema. For a renamed schema, repoint the test's mapping table and rework the affected struct in \`src/api/response/types.rs\`."
            echo ""
            echo "### Execute, in order"
            echo ""
            echo "1. Run the gates locally (\`cargo build\`, \`cargo test\`) and fix everything they force."
            echo "2. Apply every rename the spec mandates: wire params and expansions in \`src/api/shortcuts.rs\`, field and schema names in \`src/api/response/types.rs\`. Grep for old names across \`src/\` so no call site survives. Record each under Breaking changes below."
            echo "3. Retire shortcuts whose endpoints the spec removed, including their typed responses and help examples. Record under Breaking changes."
            echo "4. Do not create shortcuts for added endpoints; list worthwhile candidates under Open decisions instead."
            echo "5. You may verify a renamed wire param with read-only calls against the live API using stored credentials (\`xr whoami\`, \`xr search\` with the renamed param); never mutating calls."
            echo "6. Regenerate derived artifacts: \`scripts/generate-response-schemas.sh\` and \`scripts/generate-completions.sh\`."
            echo "7. Update \`README.md\` and \`AGENTS.md\` where the CLI surface changed."
            echo "8. Rewrite this PR body per \`.github/pull_request_template.md\`, carrying Breaking changes and Open decisions into it."
            echo ""
            echo "### Decision authority"
            echo ""
            echo "- Decide and implement without asking: spec-mandated renames, mapping repoints, retirements forced by removed endpoints, derived-artifact regeneration, documentation updates."
            echo "- Propose under Open decisions, never implement unprompted: new shortcut commands, \`ALLOWED_DIVERGENCES\` entries, version-bump classification, anything the spec leaves ambiguous. Every proposal carries your recommendation and the contextual reasoning behind it, grounded in repo precedent (for example: this endpoint resembles existing shortcuts X and Y, or similar endpoints deliberately have no shortcut)."
            echo ""
            echo "### Open decisions"
            echo ""
            echo "(none yet; append entries as: the question, your recommendation, and the precedent-based reasoning. A human resolves each by editing this section or commenting.)"
            echo ""
            echo "### Breaking changes"
            echo ""
            echo "(none yet; append each user-observable change here as you make it)"
            echo ""
            echo "### Completion criteria"
            echo ""
            echo "- [ ] All CI checks green"
            echo "- [ ] Breaking changes enumerated above"
            echo "- [ ] Derived artifacts regenerated"
            echo "- [ ] Body rewritten to the repo template, commits signed"
            echo ""
            echo "A later run that vendors newer upstream content rewrites this body and restarts the reconciliation. A no-change run refreshes only the run-link line, so sections appended under the marker survive."
          } > "${pr_body}"

          if [ "${result}" = "current" ]; then
            # Refresh only the run-link line: a full rewrite would wipe the
            # Open decisions and Breaking changes sections an agent appends
            # while reconciling under the marker.
            existing_body="$(mktemp)"
            gh pr view "${existing_num}" --json body --jq '.body | gsub("\r"; "")' > "${existing_body}"
            if [ "$(head -n1 "${existing_body}")" = "${body_marker}" ] && grep -q '^Latest workflow pass:' "${existing_body}"; then
              sed -i "s|^Latest workflow pass:.*|Latest workflow pass: [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) on $(date -u +%Y-%m-%d).|" "${existing_body}"
              gh pr edit "${existing_num}" --body-file "${existing_body}"
            else
              echo "PR #${existing_num} body is agent-owned; left untouched." >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ -n "${existing_num}" ]; then
            gh pr edit "${existing_num}" --title "${title}" --body-file "${pr_body}"
          else
            gh pr create --base dev --head "${REFRESH_BRANCH}" --title "${title}" --body-file "${pr_body}"
          fi
