# Library release wrapper: calls the centralized reusable workflow for the
# `xdk-rs` crate. Publishes to crates.io and creates a GitHub Release from
# `crates/xdk/CHANGELOG.md`; no binaries, no Homebrew.
#
# The tag line is `xdk-rs-vX.Y.Z`, so a library release never collides with
# the binary's bare `vX.Y.Z` tags, which `release.yml` owns. A library tag is
# pushed and its run is green before any binary tag whose `xdk-rs` bound
# moved: `cargo publish -p xurl-rs` resolves the library from the registry.
#
# `workflow_dispatch` is a rehearsal only: the reusable runs `cargo publish
# --dry-run`, skips the tag check, and creates no release.
name: Release library

on:
  push:
    tags:
      - 'xdk-rs-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  pipeline:
    # Pinned to the upstream commit that adds `dry_run` (brettdavies/.github#64)
    # until it merges; the commit outlives the branch, so the pin survives the
    # branch's deletion. Repoint to `@main` after the merge.
    uses: brettdavies/.github/.github/workflows/rust-lib-release.yml@fd2f59d07e02e7d37a7475238cd51cbb70ea45a1 # feat/rust-release-workspace-bounds
    with:
      crate: xdk-rs
      dry_run: ${{ github.event_name == 'workflow_dispatch' }}
