name: "Skill bundle report"
description: "Report a problem with the agent skill bundle installed by `xr skill install` (routed here from xurl-rs-skill)."
title: "[skill] "
labels: ["documentation"]
body:
  - type: input
    id: bundle-file
    attributes:
      label: Bundle file
      description: "The file inside the bundle that is wrong, for example `SKILL.md` or `references/auth-modes.md`."
    validations:
      required: true
  - type: textarea
    id: mismatch
    attributes:
      label: What the bundle says versus what xr does
      description: "Quote the bundle text, then paste the `xr` command and output that contradicts it. Redact tokens."
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: xr version
      description: "Output of `xr --version`."
      placeholder: "xr 3.1.0"
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Agent host
      description: "Which host the bundle is installed into (`xr skill install <host>`), for example `claude` or `codex`."
    validations:
      required: false
  - type: textarea
    id: ai-disclosure
    attributes:
      label: AI disclosure
      description: "One sentence: what part of this report was AI-written, what was human-written?"
      placeholder: "Entirely human-written."
    validations:
      required: true
