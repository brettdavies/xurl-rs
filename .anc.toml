# Per-CLI domain vocabulary for anc's p6-may-standard-names audit.
# These verbs are the X (Twitter) platform's canonical actions, plus
# xr-specific surface verbs (examples, validate) and the media namespace.
#
# anc applies this file to an audit of xr from this repository: the
# root with `anc audit . --bin xr`, or a built binary such as
# `anc audit target/release/xr`. For an installed xr, point anc at a
# checkout with `anc audit --command xr --repo <checkout>`. This needs an
# anc release after 0.5.0; 0.5.0 reads the file only for a directory
# target, where p6-may-standard-names has no binary to probe:
# https://github.com/brettdavies/agentnative-cli#configuration-anctoml
[p6]
domain_verbs = [
  "post", "reply", "quote", "delete", "read", "search",
  "whoami", "user", "timeline", "mentions",
  "like", "unlike", "repost", "unrepost",
  "bookmark", "unbookmark", "bookmarks", "likes",
  "follow", "unfollow", "following", "followers",
  "mute", "unmute", "muted",
  "block", "unblock", "blocked",
  "usage", "dm", "dms", "broadcasts",
  "media", "examples", "validate",
]
