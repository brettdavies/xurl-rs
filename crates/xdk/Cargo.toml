[package]
name = "xdk-rs"
version = "0.1.0"
description = "Async Rust client for the X (Twitter) API: OAuth1, OAuth2 PKCE, bearer tokens, media upload, streaming. Not affiliated with X Corp."
documentation = "https://docs.rs/xdk-rs"
keywords = ["twitter", "x", "api", "oauth", "async"]
categories = ["api-bindings", "web-programming", "asynchronous"]
readme = "../../README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
exclude = ["tests/"]

[lib]
name = "xdk"
path = "src/lib.rs"

[features]
default = ["rustls"]
# Each backend feature forwards to the reqwest feature of the same name. With
# neither, reqwest still compiles and only fails at the first https request,
# so src/lib.rs turns that configuration into a build error.
rustls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]
# Placeholder for the in-process mock server and fixtures embedders test
# against; off by default so an ordinary build pulls no test-only crate.
testing = []

[dependencies]
# HTTP
reqwest.workspace = true
futures-core = "0.3"
bytes = "1"
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

# Auth
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
url.workspace = true

# Diagnostics
tracing.workspace = true

# Schema generation
schemars.workspace = true

# Utilities
thiserror = "2"
dirs = "7"
percent-encoding = "2"
phf = "0.14"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[build-dependencies]
serde.workspace = true
serde_json.workspace = true
phf_codegen = "0.14"

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
rstest.workspace = true
serial_test.workspace = true
regex.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
# Breaking library-API changes shipping in a minor by decision. `required-update`
# reclassifies the break rather than silencing it: the gate CI runs
# (`release-type: minor`) passes silently, while a patch-level probe
# (`cargo semver-checks --release-type patch`) still names every break, which
# is how the entries below were verified. Each entry is scoped to one release
# and is self-clearing: once the tag moves the baseline past the change, the
# lint stops firing and the entry must be deleted. A standing entry understates
# the next break of the same kind.
[package.metadata.cargo-semver-checks.lints]
# Covers TokenStore.load_state: the store records how its file resolved, which
# is what the refusal-to-overwrite guard reads.
constructible_struct_adds_field = { lint-level = "deny", required-update = "minor" }
# Covers Envelope and Commands: each already breaks exhaustive matching this
# release, so the attribute costs downstream nothing it does not already spend.
enum_marked_non_exhaustive = { lint-level = "deny", required-update = "minor" }
# Covers Commands: four variants land mid-enum, shifting the discriminants after
# them. The lint guards `as isize`, which never compiled against this enum —
# every variant carries fields, and Rust rejects the cast unless all are
# field-less. Ordering follows the command grouping instead.
enum_no_repr_variant_discriminant_changed = { lint-level = "deny", required-update = "minor" }
# The eleven entries below cover the presentation move: the library no longer
# renders, prints, or opens a browser, and the modules that did live under
# `xurl::cli`, the tree the binary owns. Every entry names a `xurl-rs` 3.x
# item; this package's first baseline, the `xdk-rs-v0.1.0` tag, never had any
# of them, so the whole table is deleted at that tag rather than drained one
# entry at a time.
#
# Covers `xurl::output`, `xurl::envelope`, and `xurl::skill_install`, which are
# reachable only under `xurl::cli`.
module_missing = { lint-level = "deny", required-update = "minor" }
# Covers `OutputConfig`, `ErrorBody`, `InstallEnvelope`, and
# `InstallMultiEnvelope`, which moved with their modules. Also `ApiClient`,
# which is `Client`, and `CallOptions`, which is the call builder's private
# carrier: every shortcut returns a `Call` in place of taking options.
struct_missing = { lint-level = "deny", required-update = "minor" }
# Covers the enums those modules declared, `OutputFormat` and `InstallError`
# among them, and `XurlError`, which is `Error` at the crate root.
enum_missing = { lint-level = "deny", required-update = "minor" }
# Covers `KNOWN_HOSTS` and the `GIT_HARDEN_*` constants, which moved with the
# installer.
pub_module_level_const_missing = { lint-level = "deny", required-update = "minor" }
# Covers `format_response`, `warn_stderr`, and the installer's free functions:
# the library neither colours JSON nor writes to stderr. Also `cli::commands::run`,
# whose result type is the binary's own.
function_missing = { lint-level = "deny", required-update = "minor" }
# Covers `run_oauth2_flow`, which takes the browser opener as a closure in
# place of an output config, a writer, and a function pointer, plus
# `refresh_oauth2_token`, `run_remote_step2`, and the media entrypoints,
# which take the shared client or lost their output parameters.
function_parameter_count_changed = { lint-level = "deny", required-update = "minor" }
function_requires_different_generic_type_params = { lint-level = "deny", required-update = "minor" }
# Covers `ApiClient::set_output`: the client carries no output config, and its
# diagnostics are `tracing` events. Also `ApiClient::auth_app_name`: the
# credential state sits behind the client's lock. Also
# `CommonFlags::to_call_options{,_with_cursor}`: the binary applies its flags
# to a `Call` instead of building an options struct.
inherent_method_missing = { lint-level = "deny", required-update = "minor" }
# Covers `ApiClient::stream_request` and `Auth::oauth2_flow`: the writers and
# the verbose flag left their signatures. Also `Auth::{get_oauth2_header,
# refresh_oauth2_token, oauth2_flow, remote_oauth2_step2}`: the HTTP client is
# passed in, and the sign-in flow takes the caller's cancellation token.
method_parameter_count_changed = { lint-level = "deny", required-update = "minor" }
method_requires_different_generic_type_params = { lint-level = "deny", required-update = "minor" }
# Covers `RequestOptions.verbose` and `CallOptions.verbose`: verbosity is the
# subscriber's decision, not a per-call field.
struct_pub_field_missing = { lint-level = "deny", required-update = "minor" }
# The three entries below cover the surface audit: items the binary reaches
# across the crate boundary left the documented API behind `#[doc(hidden)]`.
#
# Covers the OAuth1 signing primitives (`auth::oauth1`), the callback listener
# (`auth::callback`), the two-step pending-state helpers (`auth::pending`),
# `store::is_app_name_char`, and the raw-URL media helpers
# (`handle_media_append_request`, `is_media_append_request`,
# `extract_media_id`, `extract_segment_index`).
function_now_doc_hidden = { lint-level = "deny", required-update = "minor" }
# Covers `MEDIA_ENDPOINT`, which the raw-URL media path matches against.
pub_module_level_const_now_doc_hidden = { lint-level = "deny", required-update = "minor" }
# Covers `StoreSnapshot` and `AppFacts` (facts `xr auth status` renders) and
# `PendingOAuth2State` (the headless two-step sign-in's file).
struct_now_doc_hidden = { lint-level = "deny", required-update = "minor" }
