[package]
name = "xdk-rs"
version = "0.1.1"
description = "Async Rust client for the X (Twitter) API: OAuth1, OAuth2 PKCE, bearer tokens, media upload, streaming. xdk is X's SDK name; this is an independent project, not affiliated with X Corp."
documentation = "https://docs.rs/xdk-rs"
keywords = ["twitter", "x", "api", "oauth", "async"]
categories = ["api-bindings", "web-programming", "asynchronous"]
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
# The mock server behind `testing` embeds the fixture file, so it ships with
# the crate even though the rest of tests/ does not.
exclude = ["tests/", "!tests/fixtures/openapi/example_responses.json"]


# How this member's changelog is cut. `scripts/generate-changelog.py --crate
# xdk-rs` reads these and passes them to git-cliff, so the workspace keeps one
# cliff.toml and each member states its own scope here.
[package.metadata.changelog]
# The heading in a PR body that addresses this member. A PR touching both crates
# describes the binary under `## Changelog` and the library under this one.
heading = "Changelog (xdk-rs)"
tag_prefix = "xdk-rs-v"
changelog = "crates/xdk/CHANGELOG.md"
include_paths = ["crates/xdk/**"]
# This config's own inputs and the file it renders are not library changes.
exclude_paths = ["crates/xdk/CHANGELOG.md"]
[lib]
name = "xdk"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["rustls"]
# Each backend feature forwards to the reqwest feature of the same name. With
# neither, reqwest still compiles and only fails at the first https request,
# so src/lib.rs turns that configuration into a build error.
rustls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]
# The in-process mock server and fixtures embedders test against; off by
# default so an ordinary build pulls no test-only crate.
testing = ["dep:wiremock"]

[dependencies]
# HTTP
reqwest.workspace = true
futures-core = "0.3"
bytes = "1"
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

# Auth
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
url.workspace = true

# Diagnostics
tracing.workspace = true

# Schema generation
schemars.workspace = true

# Testing (behind the `testing` feature only)
wiremock = { workspace = true, optional = true }

# Utilities
thiserror = "2"
dirs = "7"
percent-encoding = "2"
phf = "0.14"

[target.'cfg(unix)'.dependencies]
# One safe `getuid` for the pending-state ownership check; the crate
# forbids `unsafe`, which rules out the libc call.
rustix = { version = "1", features = ["process"] }

# The one example that needs no credential runs against the mock, so it
# exists only when the mock does; `cargo build --examples` skips it otherwise.
[[example]]
name = "offline_search"
required-features = ["testing"]

[[test]]
name = "mock_endpoint_coverage"
required-features = ["testing"]

[build-dependencies]
serde.workspace = true
serde_json.workspace = true
phf_codegen = "0.14"

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
rstest.workspace = true
serial_test.workspace = true
regex.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
# The README's subscriber example for `api::VOCABULARY_TARGET` compiles as a
# doctest against it.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
